version: '3.8'

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:26.8.1-alpine3.24
    working_dir: /app
    volumes:
      - ./server:/app
    command: sh -c "npm ci && npx prisma generate && npm run start:dev"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kanban_user:kanban_password@postgres:5432/kanban
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: refreshsecretkey
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 5000

  frontend:
    image: node:26.8.1-alpine3.24
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

volumes:
  postgres_data:
