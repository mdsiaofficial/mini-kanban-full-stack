version: '3.8'

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_password
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    volumes:
      - ./server:/app
    command: sh -c "npm ci && npx prisma generate && npm run start:dev"
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://kanban_user:kanban_password@postgres:5432/kanban
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
